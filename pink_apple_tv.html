<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pink Apple TV - Video Pembelajaran</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff7fb;
      font-family: Arial, sans-serif;
    }
    .tv {
      width: min(100%, 850px);
      padding: 18px;
      border: 5px solid #f4a1c6;
      border-radius: 35px;
      background: linear-gradient(145deg, #ffd6e8, #f5a9ce, #ffe0ed);
      box-shadow: 0 12px 28px rgba(210, 100, 150, .25);
    }
    .bezel {
      padding: 12px;
      border: 3px solid #fff;
      border-radius: 25px;
      background: linear-gradient(145deg, #fff0f7, #ffc5df);
      box-shadow: inset 0 0 10px rgba(255,255,255,.9);
    }
    .screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      padding: 5px;
      border: 5px solid #f7a9cc;
      border-radius: 16px;
      background: #171717;
    }
    iframe {
      position: absolute;
      inset: 5px;
      width: calc(100% - 10px);
      height: calc(100% - 10px);
      border: 0;
      border-radius: 10px;
    }
    .control {
      width: 35px;
      height: 7px;
      margin: 10px auto 0;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 1px 4px #e99cbd;
    }
    .caption {
      margin-top: 12px;
      color: #a94d7c;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <main class="tv" aria-label="Televisyen pink untuk video pembelajaran">
    <div class="bezel">
      <div class="screen">
        <iframe
          src="https://www.youtube.com/embed/g48ZJKtWv7k?rel=0"
          title="Video pembelajaran"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>
      <div class="control" aria-hidden="true"></div>
    </div>
    <div class="caption">♡ PINK TV ♡</div>
  </main>
</body>
</html>
